version: "3.8"

services:
  mongo:
    image: mongo
    container_name: traffic_mongo
    ports:
      - "27017:27017"

  backend:
    build: ./server
    container_name: traffic_backend
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/mern-auth
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: traffic_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend